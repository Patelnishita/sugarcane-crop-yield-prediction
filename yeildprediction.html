<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugarcane Crop Yield Prediction</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f7f2;
    margin:0;
    padding:0;
}

header{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:80%;
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

label{
    font-weight:bold;
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0 15px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#388e3c;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#2e7d32;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#e8f5e9;
    border-left:5px solid green;
    display:none;
}

footer{
    margin-top:40px;
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>
<body>

<header>
<h1>🌾 Sugarcane Crop Yield Prediction (sample webpage)</h1>
</header>

<div class="container">

<label>Farmer Name</label>
<input type="text" id="name" placeholder="Enter your name">

<label>Area (Acres)</label>
<input type="number" id="area">

<label>Rainfall (mm)</label>
<input type="number" id="rain">

<label>Temperature (°C)</label>
<input type="number" id="temp">

<label>Soil Type</label>
<select id="soil">
<option>Black Soil</option>
<option>Red Soil</option>
<option>Clay Soil</option>
<option>Loamy Soil</option>
</select>

<button onclick="predictYield()">Predict Yield</button>

<div class="result" id="output"></div>

</div>

<footer>
© 2026 Sugarcane Yield Prediction Demo
</footer>

<script>

function predictYield(){

let name=document.getElementById("name").value;
let area=parseFloat(document.getElementById("area").value);
let rain=parseFloat(document.getElementById("rain").value);
let temp=parseFloat(document.getElementById("temp").value);
let soil=document.getElementById("soil").value;

if(name=="" || isNaN(area) || isNaN(rain) || isNaN(temp)){
    alert("Please fill all fields.");
    return;
}

// Simple demo calculation
let yieldEstimate=(area*35)+(rain/100)-(temp/3);

document.getElementById("output").style.display="block";
document.getElementById("output").innerHTML=
`
<h2>Prediction Result</h2>

<p><b>Farmer:</b> ${name}</p>

<p><b>Soil Type:</b> ${soil}</p>

<p><b>Estimated Sugarcane Yield:</b>
${yieldEstimate.toFixed(2)} Tons</p>

<p style="color:green;">
✔ This is a sample prediction generated using a simple formula for demonstration purposes only.
</p>
`;

}

</script>

</body>
</html>
